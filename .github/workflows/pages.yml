name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      # GitHub Pages puts a project site at /<repo>/ and lowercases that name.
      # After a rename, configure-pages can still report the old path, so the
      # address is taken from the current repository name.
      - name: Site address
        id: site
        run: |
          name=$(printf '%s' "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          owner=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "prefix=/$name" >> "$GITHUB_OUTPUT"
          echo "base=https://${owner}.github.io/$name" >> "$GITHUB_OUTPUT"
      - name: Build
        run: npm run build
        env:
          PATH_PREFIX: ${{ steps.site.outputs.prefix }}
          SITE_BASE_URL: ${{ steps.site.outputs.base }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
